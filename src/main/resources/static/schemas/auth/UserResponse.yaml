type: object
properties:
  id:
    type: string
  email:
    type: string
  emailVerified:
    type: boolean
  status:
    $ref: "./UserStatus.yaml"
  roles:
    type: array
    items:
      $ref: "./UserRole.yaml"
  providerType:
    $ref: "./ProviderType.yaml"
  fullName:
    type: string
    nullable: true
    description: Shortened to `First L.` format. Null until the profile is completed (or if the Google name is not a valid Ukrainian full name).
    example: Тарас Ш.
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time