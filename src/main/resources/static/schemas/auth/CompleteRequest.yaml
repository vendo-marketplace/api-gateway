type: object
required: [fullName]
properties:
  fullName:
    type: string
    description: >
      First and last name in Ukrainian (Cyrillic), each starting with an uppercase letter.
      Apostrophes (', ’, ʼ) are allowed. Saved shortened to `First L.` — e.g. `Тарас Шевченко` becomes `Тарас Ш.`.
    pattern: "^[А-ЩЮЯҐЄІЇ][а-щьюяґєії'’ʼ]+ [А-ЩЮЯҐЄІЇ][а-щьюяґєії'’ʼ]+$"
    example: Тарас Шевченко
