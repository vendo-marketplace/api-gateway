type: object
properties:
  title:
    type: string
    example: iPhone 16 Pro 256GB
  description:
    type: string
    example: Brand new iPhone in perfect condition.
  quantity:
    type: integer
    example: 10
  isNew:
    type: boolean
    example: true
  price:
    type: number
    format: decimal
    example: 1299.99
  categoryId:
    type: string
    example: 6893a4d6d0b4c52d9f67e321
  attributes:
    type: array
    items:
      $ref: "./AttributeValue.yaml"
  active:
    type: boolean
    example: true