products:
  post:
    tags: [ Products ]
    summary: Create product
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/product/CreateProductRequest.yaml'
    responses:
      '200':
        description: Created
      '400':
        description: Validation failed
      '401':
        description: Unauthorized
      '404':
        description: Category not found

product:
  get:
    tags: [ Products ]
    summary: Get product by ID
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Product
        content:
          application/json:
            schema:
              $ref: '../schemas/product/ProductResponse.yaml'
      '404':
        description: Not found
  put:
    tags: [ Products ]
    summary: Update product
    parameters:
      - in: path
        name: id
        required: true
        description: Product ID
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/product/UpdateProductRequest.yaml'
    responses:
      '204':
        description: Product updated successfully
      '400':
        description: Validation failed
      '404':
        description: Product not found


attributes:
  post:
    tags: [ Attributes ]
    summary: Save attribute
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/product/CreateAttributeRequest.yaml'
    responses:
      '200':
        description: Saved
      '400':
        description: Validation failed
      '409':
        description: Attribute is already exists

categories:
  post:
    tags: [ Categories ]
    summary: Create category
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/product/CreateCategoryRequest.yaml'
    responses:
      '200':
        description: Created
      '400':
        description: Validation failed
      '401':
        description: Unauthorized
      '404':
        description: Attribute not found

categories-tree:
  get:
    tags: [ Categories ]
    summary: Get category tree
    security: [ ]
    responses:
      '200':
        description: Category tree
        content:
          application/json:
            schema:
              $ref: '../schemas/product/CategoryTreeResponse.yaml'

category:
  get:
    tags: [ Categories ]
    summary: Get category by ID
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Category
        content:
          application/json:
            schema:
              $ref: '../schemas/product/CategoryResponse.yaml'
      '404':
        description: Not found

favorite:
  post:
    tags: [ Favorites ]
    summary: Add to favorite by Product Id
    parameters:
      - in: path
        name: productId
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Created
      '400':
        description: Validation failed
      '401':
        description: Unauthorized
      '404':
        description: Not found

  delete:
    tags: [ Favorites ]
    summary: Delete favorite by Product Id
    parameters:
      - in: path
        name: productId
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Deleted
      '401':
        description: Unauthorized
      '404':
        description: Not found

favorites:
  get:
    tags: [ Favorites ]
    summary: Get favorites
    responses:
      '200':
        description: Favorites
        content:
          application/json:
            schema:
              $ref: '../schemas/product/FavoritesResponse.yaml'
      '401':
        description: Unauthorized

images:
  post:
    tags:
      - Images
    summary: Upload product images
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - productId
              - images
            properties:
              productId:
                type: string
                description: Product ID
              images:
                type: array
                items:
                  type: string
                  format: binary
                description: Product images
    responses:
      '200':
        description: Uploaded
      '400':
        description: Validation failed
      '401':
        description: Unauthorized
      '404':
        description: Product not found

  delete:
    tags:
      - Images
    summary: Delete product image
    parameters:
      - name: productId
        in: query
        required: true
        description: Product ID
        schema:
          type: string

      - name: imageKey
        in: query
        required: true
        description: Image key
        schema:
          type: string

    responses:
      '204':
        description: Deleted successfully
      '400':
        description: Validation failed
      '401':
        description: Unauthorized
      '404':
        description: Product or image not found
