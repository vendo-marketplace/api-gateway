auth-signIn:
  post:
    tags: [ Auth ]
    summary: Sign in
    security: [ ]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth/AuthRequest.yaml'
    responses:
      '200':
        description: Signed in. Access and refresh tokens are set in cookies; response body is empty.
        headers:
          Set-Cookie:
            description: Sets the accessToken and refreshToken cookies.
            schema:
              type: string
      '400':
        description: Validation failed
      '401':
        description: Wrong credentials


auth-signUp:
  post:
    tags: [ Auth ]
    summary: Sign up
    security: [ ]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth/AuthRequest.yaml'
    responses:
      '200':
        description: Signed up. Access and refresh tokens are set in cookies; response body is empty.
        headers:
          Set-Cookie:
            description: Sets the accessToken and refreshToken cookies.
            schema:
              type: string
      '409':
        description: User already exists
      '400':
        description: Validation failed

auth-refresh:
  post:
    tags: [ Auth ]
    summary: Refresh token
    security: [ ]
    parameters:
      - name: refreshToken
        in: cookie
        required: true
        description: Refresh token cookie issued by sign-in, sign-up, or Google OAuth. Its value uses the `Bearer <token>` format.
        schema:
          type: string
    responses:
      '200':
        description: Tokens refreshed. New accessToken and refreshToken cookies are set; response body is empty.
        headers:
          Set-Cookie:
            description: Sets the updated accessToken and refreshToken cookies.
            schema:
              type: string
      '401':
        description: Unauthorized

auth-google:
  post:
    tags: [ Auth ]
    summary: Google OAuth
    security: [ ]
    parameters:
      - name: authCode
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Google authentication completed. Access and refresh tokens are set in cookies; response body is empty.
        headers:
          Set-Cookie:
            description: Sets the accessToken and refreshToken cookies.
            schema:
              type: string

auth-me:
  get:
    tags: [ Auth ]
    summary: Get current user
    responses:
      '200':
        description: Current user info
        content:
          application/json:
            schema:
              $ref: '../schemas/auth/UserResponse.yaml'
      '401':
        description: Unauthorized

auth-complete:
  patch:
    tags: [ Auth ]
    summary: Complete user authorization
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/auth/CompleteRequest.yaml"
    responses:
      '200':
        description: User authorization successfully completed
      '400':
        description: Validation failed
      '409':
        description: User is already completed

password-forgot:
  post:
    tags: [ Password ]
    summary: Forgot password — send reset url to email
    security: [ ]
    parameters:
      - in: query
        name: email
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Code sent
      '409':
        description: Code already sent

password-reset:
  put:
    tags: [ Password ]
    summary: Reset password using code
    security: [ ]
    parameters:
      - in: query
        name: code
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth/ResetPasswordRequest.yaml'
    responses:
      '200':
        description: Password reset
      '410':
        description: Code session expired

password-resend:
  put:
    tags: [ Password ]
    summary: Resend password reset url
    security: [ ]
    parameters:
      - in: query
        name: email
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Code resent
      '429':
        description: Reached maximum attempts

verification-send:
  post:
    tags: [ Verification ]
    summary: Send verification code
    security: [ ]
    parameters:
      - in: query
        name: email
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Code sent
      '409':
        description: Code already sent

verification-validate:
  post:
    tags: [ Verification ]
    summary: Validate code
    parameters:
      - in: query
        name: code
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Verified
      '401':
        description: Unauthorized
      '410':
        description: Code session expired

verification-resent:
  post:
    tags: [ Verification ]
    summary: Resend verification code
    security: [ ]
    parameters:
      - in: query
        name: email
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Code resent
      '429':
        description: Reached maximum attempts
